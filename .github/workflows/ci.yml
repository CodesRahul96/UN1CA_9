name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device to build'
        required: true
        default: 'a52sxq'
      source_fw_url:
        description: 'Direct download URL for source firmware (SM-S948B_EUX zip or tar)'
        required: false
        type: string
        default: ''
      target_fw_url:
        description: 'Direct download URL for target firmware (SM-A528B_BTU zip or tar)'
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches:
      - 'sixteen'
      - 'seventeen*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          if [ $CODE -ne 0 ]; then
            echo "Shellcheck reported warnings (non-blocking for matrix build)"
          fi
          exit 0

  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            matrix="[\"${{ github.event.inputs.target }}\"]"
          elif [[ "${{ github.ref }}" == *"seventeen"* ]]; then
            matrix='["a52sxq"]'
          else
            matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: generate-matrix
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp libxml-parser-perl
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq linux-modules-extra-azure || true
          sudo modprobe erofs 2>/dev/null || true
          sudo modprobe f2fs 2>/dev/null || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        env:
          SOURCE_FW_URL: ${{ inputs.source_fw_url || secrets.SOURCE_FW_URL }}
          TARGET_FW_URL: ${{ inputs.target_fw_url || secrets.TARGET_FW_URL }}
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM and flashable ZIP
        run: ./scripts/make_rom.sh -z

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UN1CA_9_${{ matrix.target }}
          path: out/*.zip
